<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platform Tracker | Platform Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Add fixed modal style to ensure it works correctly when copied */
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            z-index: 50;
        }
        /* Make the stages clearly clickable */
        .stage-item {
            cursor: pointer;
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-800">
    <header class="bg-white p-4 shadow-md flex items-center justify-between">
        <div class="flex items-center space-x-4">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-blue-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <path d="M7 7h10"></path>
                <path d="M7 12h10"></path>
                <path d="M7 17h10"></path>
            </svg>
            <a href="{{ url_for('dashboard') }}" class="text-xl font-bold">Dashboard</a>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-sm font-medium">Hello, {{ username }}!</span>
            <a href="{{ url_for('logout') }}" class="flex items-center text-red-500 hover:text-red-700 transition duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
                Logout
            </a>
        </div>
    </header>

    <main class="p-6 md:p-10">
        <h1 class="text-3xl font-bold mb-6">Platform Tracker</h1>

        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold">Platform Progress</h2>
                <div class="flex items-center space-x-4">
                    <div class="flex items-center space-x-2">
                        <label for="platform-progress-menu" class="text-sm font-medium text-gray-700">Select Platform:</label>
                        <select id="platform-progress-menu" class="rounded-md border-gray-300 shadow-sm">
                            {% for platform in platforms %}
                                <option value="{{ platform.name }}">{{ platform.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <a href="{{ url_for('documents') }}" class="text-blue-600 hover:text-blue-800">
                        Manage Documents
                    </a>
                </div>
            </div>
            
            <div id="progress-bar-container" class="flex flex-col md:flex-row items-center justify-between space-x-2 text-sm text-center">
                <div class="stage-item flex flex-col items-center flex-1" data-stage="SRS">
                    <div id="stage-srs" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-white transition-colors duration-300 bg-gray-300 text-gray-500">
                        SRS
                    </div>
                    <div id="date-srs" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
                <div class="stage-line flex-1 h-1 bg-gray-300 transition-colors duration-300 hidden md:block"></div>
                
                <div class="stage-item flex flex-col items-center flex-1" data-stage="RFP">
                    <div id="stage-rfp" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 transition-colors duration-300 bg-gray-300">
                        RFP
                    </div>
                    <div id="date-rfp" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
                <div class="stage-line flex-1 h-1 bg-gray-300 transition-colors duration-300 hidden md:block"></div>

                <div class="stage-item flex flex-col items-center flex-1" data-stage="RFQ">
                    <div id="stage-rfq" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 transition-colors duration-300 bg-gray-300">
                        RFQ
                    </div>
                    <div id="date-rfq" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
                <div class="stage-line flex-1 h-1 bg-gray-300 transition-colors duration-300 hidden md:block"></div>

                <div class="stage-item flex flex-col items-center flex-1" data-stage="POC">
                    <div id="stage-poc" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 transition-colors duration-300 bg-gray-300">
                        POC
                    </div>
                    <div id="date-poc" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
                <div class="stage-line flex-1 h-1 bg-gray-300 transition-colors duration-300 hidden md:block"></div>

                <div class="stage-item flex flex-col items-center flex-1" data-stage="ATP">
                    <div id="stage-atp" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 transition-colors duration-300 bg-gray-300">
                        ATP
                    </div>
                    <div id="date-atp" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
                <div class="stage-line flex-1 h-1 bg-gray-300 transition-colors duration-300 hidden md:block"></div>

                <div class="stage-item flex flex-col items-center flex-1" data-stage="RFS">
                    <div id="stage-rfs" class="stage-circle w-10 h-10 rounded-full flex items-center justify-center font-bold text-gray-500 transition-colors duration-300 bg-gray-300">
                        RFS
                    </div>
                    <div id="date-rfs" class="stage-date mt-1 text-xs text-gray-500"></div>
                </div>
            </div>
            
            <div class="mt-8 pt-6 border-t border-gray-200">
                <h3 class="text-lg font-semibold mb-4">Update Progress</h3>
                
                <form id="progress-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label for="progress-stage" class="block text-sm font-medium text-gray-700">Select Stage</label>
                            <select id="progress-stage" name="progress_stage" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                                <option value="SRS">SRS</option>
                                <option value="RFP">RFP</option>
                                <option value="RFQ">RFQ</option>
                                <option value="POC">POC</option>
                                <option value="ATP">ATP</option>
                                <option value="RFS">RFS</option>
                            </select>
                        </div>
                        <div>
                            <label for="stage-date" class="block text-sm font-medium text-gray-700">Stage Date</label>
                            <input type="date" id="stage-date" name="stage_date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm" required>
                        </div>
                        <div class="md:col-span-1">
                            <label for="progress-comments" class="block text-sm font-medium text-gray-700">Comments</label>
                            <textarea id="progress-comments" name="comments" rows="1" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"></textarea>
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700">Update Progress</button>
                    </div>
                </form>
                
            </div>
        </div>
        
        {% if user_role == 'Admin' %}
            <div class="bg-green-50 border border-green-200 rounded-xl shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-green-800">Adding Platform</h2>
                <form id="add-platform-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                        <div class="w-full">
                            <label for="platform-name-input" class="block text-sm font-medium text-gray-700">Platform Name</label>
                            <input type="text" id="platform-name-input" name="platform_name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" required>
                        </div>
                        <div class="w-full">
                            <label for="grafana-url-input" class="block text-sm font-medium text-gray-700">Grafana URL</label>
                            <input type="url" id="grafana-url-input" name="grafana_url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="Optional URL">
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-end pt-4 border-t border-green-200">
                        <div class="w-full">
                            <label for="prometheus-url-input" class="block text-sm font-medium text-gray-700">Prometheus Server URL (Base)</label>
                            <input type="url" id="prometheus-url-input" name="prometheus_url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="e.g., http://my-prometheus:9090">
                        </div>
                        <div class="w-full">
                            <label for="health-check-endpoint-input" class="block text-sm font-medium text-gray-700">Health Check Endpoint</label>
                            <input type="text" id="health-check-endpoint-input" name="health_check_endpoint" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="e.g., api/v1/status/tsdb">
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">Add Platform</button>
                    </div>
                </form>
                <div id="platform-feedback-message" class="mt-4 hidden p-3 rounded-md"></div>
            </div>

            <div class="bg-yellow-50 border border-yellow-200 rounded-xl shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-yellow-800">Platform Update</h2>
                <form id="update-platform-form" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                        <div class="w-full">
                            <label for="platform-update-menu" class="block text-sm font-medium text-yellow-700">Select Platform to Update</label>
                            <select id="platform-update-menu" class="mt-1 block w-full rounded-md border-yellow-300 shadow-sm focus:border-yellow-500 focus:ring focus:ring-yellow-200 focus:ring-opacity-50" required>
                                <option value="" disabled selected>Select a platform...</option>
                                {% for platform in platforms %}
                                    <option value="{{ platform.name }}">{{ platform.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="w-full">
                            <label for="new-platform-name-input" class="block text-sm font-medium text-gray-700">New Platform Name</label>
                            <input type="text" id="new-platform-name-input" name="new_platform_name" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="Required">
                        </div>
                        <div class="w-full">
                            <label for="new-grafana-url-input" class="block text-sm font-medium text-gray-700">New Grafana URL</label>
                            <input type="url" id="new-grafana-url-input" name="grafana_url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="Optional URL">
                        </div>
                        <div class="w-full">
                            <label for="new-prometheus-url-input" class="block text-sm font-medium text-gray-700">New Prometheus URL</label>
                            <input type="url" id="new-prometheus-url-input" name="prometheus_url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="Optional URL">
                        </div>
                        <div class="w-full md:col-span-2">
                            <label for="new-health-check-endpoint-input" class="block text-sm font-medium text-gray-700">New Health Check Endpoint</label>
                            <input type="text" id="new-health-check-endpoint-input" name="health_check_endpoint" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" placeholder="Optional Endpoint">
                        </div>
                    </div>
                    <div class="flex justify-end">
                        <button type="submit" class="py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-yellow-600 hover:bg-yellow-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-yellow-500">Update Platform</button>
                    </div>
                </form>
                <div id="update-platform-feedback-message" class="mt-4 hidden p-3 rounded-md"></div>
            </div>
            <div class="bg-red-50 border border-red-200 rounded-xl shadow-lg p-6 mb-8">
                <h2 class="text-xl font-semibold mb-4 text-red-800">Platform Deletion</h2>
                <form id="delete-platform-form" class="flex flex-col md:flex-row items-end space-y-4 md:space-y-0 md:space-x-4">
                    <div class="flex-1 w-full">
                        <label for="platform-delete-menu" class="block text-sm font-medium text-red-700">Select Platform to Delete</label>
                        <select id="platform-delete-menu" class="mt-1 block w-full rounded-md border-red-300 shadow-sm focus:border-red-500 focus:ring focus:ring-red-200 focus:ring-opacity-50" required>
                            <option value="" disabled selected>Select a platform...</option>
                            {% for platform in platforms %}
                                <option value="{{ platform.name }}">{{ platform.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="w-full md:w-auto py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-red-600 hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">Delete Platform</button>
                </form>
                <div id="delete-platform-feedback-message" class="mt-4 hidden p-3 rounded-md"></div>
            </div>
        {% endif %}
        
    </main>

    <div id="message-modal" class="modal hidden flex items-center justify-center">
        <div class="relative p-5 border w-96 shadow-lg rounded-md bg-white">
            <h3 id="modal-title" class="text-lg leading-6 font-medium text-gray-900 mb-4"></h3>
            <p id="modal-message" class="text-sm text-gray-500"></p>
            <div class="mt-5 flex justify-end" id="modal-footer">
                <button id="modal-close" class="px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                    OK
                </button>
            </div>
        </div>
    </div>


    <script>
        // Addition/Deletion related constants
        const deletePlatformForm = document.getElementById('delete-platform-form');
        const platformDeleteMenu = document.getElementById('platform-delete-menu');
        const deletePlatformFeedback = document.getElementById('delete-platform-feedback-message');
        const addPlatformForm = document.getElementById('add-platform-form');
        const addPlatformFeedback = document.getElementById('platform-feedback-message');

        // NEW inputs for adding platforms
        const prometheusUrlInput = document.getElementById('prometheus-url-input');
        const healthCheckEndpointInput = document.getElementById('health-check-endpoint-input');
        
        // Update related constants
        const updatePlatformForm = document.getElementById('update-platform-form');
        const platformUpdateMenu = document.getElementById('platform-update-menu');
        const newPlatformNameInput = document.getElementById('new-platform-name-input');
        const newGrafanaUrlInput = document.getElementById('new-grafana-url-input');
        const newPrometheusUrlInput = document.getElementById('new-prometheus-url-input');
        const newHealthCheckEndpointInput = document.getElementById('new-health-check-endpoint-input');
        const updatePlatformFeedback = document.getElementById('update-platform-feedback-message');

        
        // Progress bar related constants
        const progressMenu = document.getElementById('platform-progress-menu');
        const progressForm = document.getElementById('progress-form');
        const progressStages = ['SRS', 'RFP', 'RFQ', 'POC', 'ATP', 'RFS'];
        const progressBarContainer = document.getElementById('progress-bar-container'); 
        
        // MAPPING: Store the progress data fetched from the API for easy lookup
        let currentPlatformProgress = {}; 

        const stageDates = {
            SRS: document.getElementById('date-srs'),
            RFP: document.getElementById('date-rfp'),
            RFQ: document.getElementById('date-rfq'),
            POC: document.getElementById('date-poc'),
            ATP: document.getElementById('date-atp'),
            RFS: document.getElementById('date-rfs')
        };
        
        // Modal functions and constants
        const messageModal = document.getElementById('message-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalFooter = document.getElementById('modal-footer');
        const modalClose = document.getElementById('modal-close');


        // Function to show a simple notification modal
        function showMessage(title, message, isHtml = false) { 
            modalTitle.textContent = title;
            if (isHtml) {
                modalMessage.innerHTML = message;
            } else {
                modalMessage.textContent = message;
            }
            
            // Clear and set for simple 'OK' button
            modalFooter.innerHTML = '';
            const okButton = document.createElement('button');
            okButton.id = 'modal-close-simple';
            okButton.textContent = 'OK';
            okButton.className = 'px-4 py-2 bg-blue-500 text-white text-base font-medium rounded-md w-full shadow-sm hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500';
            okButton.onclick = hideMessage;
            modalFooter.appendChild(okButton);

            messageModal.classList.remove('hidden');
            messageModal.classList.add('flex');
        }

        // Function to hide the modal
        function hideMessage() {
            messageModal.classList.remove('flex');
            messageModal.classList.add('hidden');
        }


        // --- Progress Bar Logic ---
        function renderProgressBar(progressData) {
            // Store the data in the global mapping for click events
            currentPlatformProgress = {}; 
            progressData.forEach(item => {
                currentPlatformProgress[item.progress_stage] = item;
            });

            // Reset logic remains the same...
            progressStages.forEach(stage => {
                const stageCircle = document.getElementById(`stage-${stage.toLowerCase()}`);
                // Safely get the next sibling, which is the stage-line
                const stageLine = stageCircle ? stageCircle.parentElement.nextElementSibling : null; 
                
                if (stageCircle) {
                    stageCircle.classList.remove('bg-blue-600', 'text-white');
                    stageCircle.classList.add('bg-gray-300', 'text-gray-500');
                }
                if (stageLine && stageLine.classList.contains('stage-line')) {
                    stageLine.classList.remove('bg-blue-600');
                    stageLine.classList.add('bg-gray-300');
                }

                if (stageDates[stage]) {
                    stageDates[stage].textContent = '';
                    // Clear the title/tooltip as well
                    stageDates[stage].removeAttribute('title');
                }
            });

            // Populate progress data and update the bar
            progressData.forEach(item => {
                const currentStage = item.progress_stage;
                // Format date for better display
                const dateObj = new Date(item.stage_date);
                const currentDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
                
                const currentIndex = progressStages.indexOf(currentStage);

                // Update circle and line up to the current stage
                for (let i = 0; i <= currentIndex; i++) {
                    const stage = progressStages[i];
                    const stageCircle = document.getElementById(`stage-${stage.toLowerCase()}`);
                    const stageLine = stageCircle ? stageCircle.parentElement.nextElementSibling : null;
                    
                    if (stageCircle) {
                        stageCircle.classList.remove('bg-gray-300', 'text-gray-500');
                        stageCircle.classList.add('bg-blue-600', 'text-white');
                    }
                    if (stageLine && stageLine.classList.contains('stage-line')) {
                        stageLine.classList.remove('bg-gray-300');
                        stageLine.classList.add('bg-blue-600');
                    }
                }
                
                // Set the date for the current stage
                if (stageDates[currentStage]) {
                    stageDates[currentStage].textContent = currentDate;
                    // Add comments as a tooltip or title attribute
                    stageDates[currentStage].title = item.comments || 'No comments';
                }
            });
        }

        async function fetchProgressAndRender(platformName) {
            const response = await fetch(`/api/platform_progress/${platformName}`);
            const progressData = await response.json();
            if (response.ok) {
                renderProgressBar(progressData);
            } else {
                renderProgressBar([]); // Render empty progress bar if no data found
                console.error('No progress found for this platform');
            }
        }

        progressMenu.addEventListener('change', (e) => {
            const selectedPlatform = e.target.value;
            fetchProgressAndRender(selectedPlatform);
        });
        
        // Event listener for progress bar stage clicks (visible for all users)
        if (progressBarContainer) {
            progressBarContainer.addEventListener('click', (e) => {
                let stageItem = e.target.closest('.stage-item');
                if (stageItem) {
                    const stage = stageItem.dataset.stage;
                    const progress = currentPlatformProgress[stage];
                    
                    if (progress) {
                        const dateObj = new Date(progress.stage_date);
                        const formattedDate = dateObj.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
                        
                        const title = `Details for Stage: ${progress.progress_stage}`;
                        const message = `
                            <p class="mb-2"><strong>Platform:</strong> ${progressMenu.value}</p>
                            <p class="mb-2"><strong>Date Completed:</strong> ${formattedDate}</p>
                            <hr class="my-3"/>
                            <p><strong>Comments:</strong></p>
                            <p class="text-gray-700">${progress.comments || 'No comments provided for this stage.'}</p>
                        `;
                        
                        showMessage(title, message, true); // Pass true to indicate HTML content
                    } else {
                        const title = 'Stage Incomplete';
                        const message = `The platform progress for stage "${stage}" is not yet available or recorded.`;
                        showMessage(title, message);
                    }
                }
            });
        }

        // Progress Form Submission (Enabled for all logged-in users)
        if (progressForm) {
            progressForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const data = {
                    platform_name: progressMenu.value,
                    progress_stage: formData.get('progress_stage'),
                    stage_date: formData.get('stage_date'),
                    comments: formData.get('comments')
                };

                const response = await fetch('/api/platform_progress', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.status === 'success') {
                    showMessage('Success', 'Progress updated successfully!');
                    fetchProgressAndRender(progressMenu.value);
                    progressForm.reset();
                } else {
                    showMessage('Error', 'Failed to update progress: ' + result.message);
                }
            });
        }
        
        // Platform Addition Logic (Only for Admin, check for form existence)
        if (addPlatformForm) {
            addPlatformForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const platformName = document.getElementById('platform-name-input').value;
                const grafanaUrl = document.getElementById('grafana-url-input').value;
                const prometheusUrl = prometheusUrlInput.value;
                const healthCheckEndpoint = healthCheckEndpointInput.value;

                addPlatformFeedback.classList.add('hidden');
                
                const response = await fetch('/api/add_platform', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        platform_name: platformName,
                        grafana_url: grafanaUrl,
                        prometheus_url: prometheusUrl,
                        health_check_endpoint: healthCheckEndpoint
                    })
                });

                const result = await response.json();
                addPlatformFeedback.classList.remove('hidden');
                if (result.status === 'success') {
                    addPlatformFeedback.classList.remove('bg-red-100', 'text-red-700');
                    addPlatformFeedback.classList.add('bg-green-100', 'text-green-700');
                    addPlatformFeedback.textContent = 'Platform added successfully! Please refresh the page to see the changes.';
                    
                    await updatePlatformDropdowns();
                    addPlatformForm.reset();
                } else {
                    addPlatformFeedback.classList.remove('bg-green-100', 'text-green-700');
                    addPlatformFeedback.classList.add('bg-red-100', 'text-red-700');
                    addPlatformFeedback.textContent = 'Error: ' + result.message;
                }
            });
        }

        // Platform Update Logic (Only for Admin, check for form existence)
        if (updatePlatformForm) {
            updatePlatformForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const oldPlatformName = platformUpdateMenu.value;
                const newPlatformName = newPlatformNameInput.value.trim();
                const grafanaUrl = newGrafanaUrlInput.value.trim();
                const prometheusUrl = newPrometheusUrlInput.value.trim();
                const healthCheckEndpoint = newHealthCheckEndpointInput.value.trim();

                if (!oldPlatformName || !newPlatformName) {
                    updatePlatformFeedback.classList.remove('hidden');
                    updatePlatformFeedback.classList.remove('bg-green-100', 'text-green-700');
                    updatePlatformFeedback.classList.add('bg-red-100', 'text-red-700');
                    updatePlatformFeedback.textContent = 'Please select a platform and provide a new platform name.';
                    return;
                }

                updatePlatformFeedback.classList.add('hidden');

                const data = {
                    old_platform_name: oldPlatformName,
                    new_platform_name: newPlatformName,
                    grafana_url: grafanaUrl,
                    prometheus_url: prometheusUrl,
                    health_check_endpoint: healthCheckEndpoint
                };

                const response = await fetch('/api/update_platform', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                updatePlatformFeedback.classList.remove('hidden');

                if (result.status === 'success') {
                    updatePlatformFeedback.classList.remove('bg-red-100', 'text-red-700');
                    updatePlatformFeedback.classList.add('bg-green-100', 'text-green-700');
                    updatePlatformFeedback.textContent = result.message + ' Note: You may need to refresh the main dashboard (index.html) to see the card name updated.';

                    await updatePlatformDropdowns();
                    updatePlatformForm.reset();

                    if (oldPlatformName !== newPlatformName) {
                        document.getElementById('platform-progress-menu').value = newPlatformName;
                        fetchProgressAndRender(newPlatformName);
                    } else {
                        fetchProgressAndRender(oldPlatformName);
                    }
                } else {
                    updatePlatformFeedback.classList.remove('bg-green-100', 'text-green-700');
                    updatePlatformFeedback.classList.add('bg-red-100', 'text-red-700');
                    updatePlatformFeedback.textContent = 'Error: ' + result.message;
                }
            });
        }


        // Platform Deletion Logic (Only for Admin, check for form existence)
        if (deletePlatformForm) {
            deletePlatformForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                const platformName = platformDeleteMenu.value;

                if (!platformName) {
                    deletePlatformFeedback.classList.remove('hidden');
                    deletePlatformFeedback.classList.remove('bg-green-100', 'text-green-700');
                    deletePlatformFeedback.classList.add('bg-red-100', 'text-red-700');
                    deletePlatformFeedback.textContent = 'Please select a platform to delete.';
                    return;
                }

                // --- Simplified Confirmation Modal ---
                const confirmDelete = await new Promise(resolve => {
                    modalTitle.textContent = 'Confirm Permanent Deletion';
                    modalMessage.textContent = `WARNING: Are you sure you want to permanently delete the platform "${platformName}"? This action cannot be undone and will delete ALL associated data (dashboard card, progress, documents, and physical files).`;

                    // Clear existing footer and add new confirmation buttons
                    modalFooter.innerHTML = '';
                    
                    const cancelButton = document.createElement('button');
                    cancelButton.textContent = 'Cancel';
                    cancelButton.className = 'px-4 py-2 bg-gray-300 text-gray-800 text-base font-medium rounded-md w-1/2 shadow-sm hover:bg-gray-400 focus:outline-none';
                    cancelButton.style.marginRight = '0.5rem';

                    const confirmButton = document.createElement('button');
                    confirmButton.textContent = 'Confirm Delete';
                    confirmButton.className = 'px-4 py-2 bg-red-600 text-white text-base font-medium rounded-md w-1/2 shadow-sm hover:bg-red-700 focus:outline-none';

                    modalFooter.appendChild(cancelButton);
                    modalFooter.appendChild(confirmButton);
                    modalFooter.classList.add('flex', 'justify-end', 'space-x-3'); // Ensure buttons are inline

                    messageModal.classList.remove('hidden');
                    messageModal.classList.add('flex');

                    confirmButton.onclick = () => {
                        hideMessage();
                        resolve(true); // User confirmed
                    };

                    cancelButton.onclick = () => {
                        hideMessage();
                        resolve(false); // User canceled
                    };
                });
                // --- End Confirmation Modal ---


                if (!confirmDelete) {
                    return;
                }

                // Proceed with deletion API call
                deletePlatformFeedback.classList.add('hidden');

                const response = await fetch('/api/delete_platform', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ platform_name: platformName })
                });

                const result = await response.json();
                deletePlatformFeedback.classList.remove('hidden');

                if (result.status === 'success') {
                    deletePlatformFeedback.classList.remove('bg-red-100', 'text-red-700');
                    deletePlatformFeedback.classList.add('bg-green-100', 'text-green-700');
                    deletePlatformFeedback.textContent = result.message + ' Note: You may need to refresh the main dashboard (index.html) to see the card removed.';

                    // Update all platform dropdowns
                    await updatePlatformDropdowns();
                    platformDeleteMenu.value = '';
                    
                    // Also reset progress bar if the deleted platform was selected
                    if (progressMenu.value === platformName) {
                        renderProgressBar([]);
                    }

                } else {
                    deletePlatformFeedback.classList.remove('bg-green-100', 'text-green-700');
                    deletePlatformFeedback.classList.add('bg-red-100', 'text-red-700');
                    deletePlatformFeedback.textContent = 'Error: ' + result.message;
                }
            });
        }


        // Helper function to update all platform dropdowns by re-fetching the HTML
        async function updatePlatformDropdowns() {
            // Using fetch to get the HTML content of the page
            const platformsResponse = await fetch('/platform_tracker');
            const parser = new DOMParser();
            const doc = parser.parseFromString(await platformsResponse.text(), 'text/html');
            
            // Re-fetch the content of the dropdowns from the newly parsed HTML
            const newProgressMenuHTML = doc.getElementById('platform-progress-menu').innerHTML;
            
            // Check if the Admin-only elements exist before attempting to access their innerHTML
            const newPlatformDeleteMenu = doc.getElementById('platform-delete-menu');
            const newPlatformUpdateMenu = doc.getElementById('platform-update-menu');

            // Update the DOM elements
            document.getElementById('platform-progress-menu').innerHTML = newProgressMenuHTML;
            
            // Conditionally update Admin-only dropdowns
            if (newPlatformDeleteMenu) {
                document.getElementById('platform-delete-menu').innerHTML = newPlatformDeleteMenu.innerHTML;
            }
            if (newPlatformUpdateMenu) {
                document.getElementById('platform-update-menu').innerHTML = newPlatformUpdateMenu.innerHTML;
            }
        }


        // Initial call to fetch progress when the page loads
        document.addEventListener('DOMContentLoaded', () => {
            const firstPlatform = progressMenu.value;
            if (firstPlatform) {
                fetchProgressAndRender(firstPlatform);
            }
        });
    </script>
</body>
</html>
